{% extends 'boutique\base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 card bg-base-200 shadow-xl border border-error">
    <div class="card-body">
        <h2 class="card-title text-error text-2xl font-serif">Confirm Deletion</h2>
        <p class="mt-2 text-lg">Are you sure you want to permanently delete "<strong>{{ object }}</strong>"?</p>
        <p class="text-sm text-base-content/60 mt-1">This action cannot be undone.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="card-actions justify-end mt-6">
                <a href="{% url 'women_list' %}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-error">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
