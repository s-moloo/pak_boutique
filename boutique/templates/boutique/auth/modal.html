<!-- Native <dialog> element styled by DaisyUI -->
<dialog id="auth_modal" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box w-full max-w-md">

    <!-- Close button (top-right) -->
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-3 top-3">
        ✕
      </button>
    </form>

    <h2 class="text-2xl font-bold mb-6 text-center">Welcome to Pak Boutique</h2>

    <!-- Tabs: Login | Register -->
    <div role="tablist" class="tabs tabs-bordered mb-6">

      <!-- ── LOGIN TAB ─────────────────────────────────────────── -->
      <input type="radio" name="auth_tabs" role="tab"
             class="tab" aria-label="Login" checked>
      <div role="tabpanel" class="tab-content pt-4">

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <!-- Redirect back to the page the user was on -->
          <input type="hidden" name="next" value="{{ request.path }}">

          <div class="form-control mb-4">
            <label class="label">
              <span class="label-text">Username</span>
            </label>
            <input type="text" name="username" required
                   placeholder="your username"
                   class="input input-bordered w-full">
          </div>

          <div class="form-control mb-6">
            <label class="label">
              <span class="label-text">Password</span>
            </label>
            <input type="password" name="password" required
                   placeholder="••••••••"
                   class="input input-bordered w-full">
          </div>

          <button type="submit" class="btn btn-primary w-full">
            Log in
          </button>
        </form>

      </div><!-- /login tab -->

      <!-- ── REGISTER TAB ──────────────────────────────────────── -->
      <input type="radio" name="auth_tabs" role="tab"
             class="tab" aria-label="Register">
      <div role="tabpanel" class="tab-content pt-4">

        <form method="post" action="{% url 'register' %}">
          {% csrf_token %}

          <div class="form-control mb-4">
            <label class="label">
              <span class="label-text">Username</span>
            </label>
            <input type="text" name="username" required
                   placeholder="choose a username"
                   class="input input-bordered w-full">
          </div>

          <div class="form-control mb-4">
            <label class="label">
              <span class="label-text">
                Email
                <span class="opacity-50 text-xs">(optional)</span>
              </span>
            </label>
            <input type="email" name="email"
                   placeholder="you@example.com"
                   class="input input-bordered w-full">
          </div>

          <div class="form-control mb-4">
            <label class="label">
              <span class="label-text">Password</span>
            </label>
            <input type="password" name="password1" required
                   placeholder="••••••••"
                   class="input input-bordered w-full">
          </div>

          <div class="form-control mb-6">
            <label class="label">
              <span class="label-text">Confirm Password</span>
            </label>
            <input type="password" name="password2" required
                   placeholder="••••••••"
                   class="input input-bordered w-full">
          </div>

          <button type="submit" class="btn btn-success w-full">
            Create Account
          </button>
        </form>

      </div><!-- /register tab -->

    </div><!-- /tabs -->
  </div>

  <!-- Click the backdrop to close -->
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
