{% extends 'boutique\base.html' %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 card bg-base-200 shadow-xl">
    <div class="card-body">
        <h2 class="card-title text-2xl mb-4 font-serif text-primary">
            {% if object %}Edit{% else %}Add{% endif %} Kids' Item
        </h2>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div class="bg-base-100 p-4 rounded-lg shadow-inner">
                {{ form.as_p }}
            </div>
            <div class="card-actions justify-end mt-6">
                <a href="{% url 'kids_list' %}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Item</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
